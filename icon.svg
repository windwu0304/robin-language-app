<rect x="84" y="148" width="8" height="8" fill="#e67e22"/>
<rect x="86" y="150" width="4" height="4" fill="#27ae60"/>
<rect x="100" y="148" width="8" height="8" fill="#e67e22"/>
<rect x="102" y="150" width="4" height="4" fill="#27ae60"/>

