<rect x="106" y="90" width="6" height="6" fill="#ffffff"/>

<!-- 臉頰 -->
<rect x="56" y="104" width="80" height="16" fill="#fdd5b1"/>

<!-- 腮紅 -->
<rect x="60" y="108" width="8" height="8" fill="#ffb8a8" opacity="0.6"/>
<rect x="124" y="108" width="8" height="8" fill="#ffb8a8" opacity="0.6"/>

<!-- 微笑 -->
<rect x="80" y="116" width="8" height="4" fill="#d47b7b"/>
<rect x="88" y="116" width="16" height="4" fill="#d47b7b"/>
<rect x="104" y="116" width="8" height="4" fill="#d47b7b"/>

<!-- 下巴 -->
<rect x="56" y="120" width="80" height="16" fill="#fdd5b1"/>

<!-- 白色衣服 -->
<rect x="56" y="136" width="80" height="32" fill="#ffffff"/>

